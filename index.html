  <meta charset="UTF-8" />

  <title>Under Theory | Spotify</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060607;
      --card-bg: rgba(18, 18, 22, 0.7);
      --card-border: #1f1f26;
      --neon-violet: #b026ff;
      --neon-violet-bright: #d946ef;
      --neon-glow: rgba(176, 38, 255, 0.45);
      --text-main: #f4f4f5;
      --text-muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Violet Neon Glow in background */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--neon-glow) 0%, rgba(0, 0, 0, 0) 70%);
      opacity: 0.35;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 440px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Header */
    .title-badge {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .artist-name {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 0 16px var(--neon-glow);
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 36px;
      text-transform: uppercase;
    }

    /* Track List Section */
    .links-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    /* Buttons */
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      transition: all 0.25s ease-in-out;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .link-btn .track-info {
      text-align: left;
    }

    .link-btn .track-title {
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: block;
      color: #ffffff;
    }

    .link-btn .track-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
      display: block;
    }

    /* Play Icon Bubble */
    .play-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #18181f;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #2d2d38;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .play-icon svg {
      width: 14px;
      height: 14px;
      fill: #ffffff;
      margin-left: 2px;
      transition: fill 0.25s ease;
    }

    /* Hover States - Violet Neon */
    .link-btn:hover {
      border-color: var(--neon-violet);
      box-shadow: 0 0 16px var(--neon-glow), inset 0 0 10px rgba(176, 38, 255, 0.1);
      transform: translateY(-2px);
    }

    .link-btn:hover .play-icon {
      background: var(--neon-violet);
      border-color: var(--neon-violet-bright);
      box-shadow: 0 0 12px var(--neon-violet);
    }

    .link-btn:hover .play-icon svg {
      fill: #ffffff;
    }

    /* Spotify Profile Button */
    .profile-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      background: transparent;
      border: 1.5px solid var(--neon-violet);
      border-radius: 12px;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.88rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 14px var(--neon-glow);
      transition: all 0.25s ease-in-out;
    }

    .profile-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .profile-btn:hover {
      background: var(--neon-violet);
      color: #ffffff;
      box-shadow: 0 0 25px var(--neon-violet);
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      margin-top: 36px;
      font-size: 0.75rem;
      color: #3f3f46;
      letter-spacing: 1.5px;
    }
  </style>
</head>
